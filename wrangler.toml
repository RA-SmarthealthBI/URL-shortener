name = "go-shortener"
main = "src/index.ts"
compatibility_date = "2025-09-01"
# qrcode -> pngjs needs Node's zlib/stream/buffer APIs.
compatibility_flags = ["nodejs_compat"]

# Only serve on your own domain, never on *.workers.dev.
workers_dev = false
# go.ra-smarthealth.com stays on its existing DNS provider (Wix) and reaches
# this Worker as a Cloudflare for SaaS custom hostname of the helper zone
# ra-smarthealth-links.com. "*/*" catches every hostname entering that zone,
# custom hostnames included. See README → Setup.
routes = [
  { pattern = "*/*", zone_name = "ra-smarthealth-links.com" },
]

[vars]
# Public origin encoded in QR codes and shown in the admin UI. No trailing slash.
BASE_URL = "https://go.ra-smarthealth.com"
# Used when an expired / capped link has no fallback of its own. Leave empty
# to require a per-link fallback whenever expiry or a cap is set.
DEFAULT_FALLBACK_URL = ""

# Slug -> link record. Hot path for every redirect.
[[kv_namespaces]]
binding = "LINKS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Link registry (source of truth, enforces unique slugs) + click log.
[[d1_databases]]
binding = "DB"
database_name = "go-shortener"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# ADMIN_PASSWORD is a secret: `npx wrangler secret put ADMIN_PASSWORD`.
# Never put it in this file.
